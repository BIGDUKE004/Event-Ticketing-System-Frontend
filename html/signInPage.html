<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>EventPadii - Sign In</title>

    <link rel="stylesheet" href="../css/signInPage.css">
</head>

<body>

    <div class="page-container">

        <div class="login-card">


            <div class="logo-container">
                <img class="logo" src="../images/eventpad_logo_horizontal_purple.png">
            </div>



            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Sign in to your account to continue
            </p>



            <form id="loginForm">


                <div class="form-group">

                    <label for="email">
                        Email address
                    </label>

                    <div class="input-container">

                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="email"
                            name="email"
                            placeholder="Enter your email"
                            required
                        >

                    </div>

                </div>



                <div class="form-group">

                    <div class="password-label">

                        <label for="password">
                            Password
                        </label>

                    </div>

                    <div class="input-container">

                        <span class="input-icon"></span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            id="togglePassword"
                            aria-label="Show password"
                        >
                            ◉
                        </button>

                    </div>

                </div>



                <div class="forgot-container">

                    <a href="#">
                        Forgot password?
                    </a>

                </div>



                <button type="submit" class="signin-button">
                    Sign In
                </button>

            </form>



            <div class="divider">

                <span></span>

                <p>or</p>

                <span></span>

            </div>



            <button class="social-button google-button">

                <img src="../image/google_logo.png" alt="Google" class="social-icon">

                <span>Continue with Google</span>

            </button>



            <button class="social-button apple-button">
                 <img
                 src="../image/apple_logo.png"
                 alt="Apple"
                class="social-icon apple-icon">

                <span>Continue with Apple</span>
            </button>


            <p class="signup-text">

                Don't have an account?

                <a href="#">
                    Sign up
                </a>

            </p>

        </div>

    </div>


    <script>


        const passwordInput = document.getElementById("password");


        const togglePassword = document.getElementById("togglePassword");



        togglePassword.addEventListener("click", function () {

            if (passwordInput.type === "password") {

                passwordInput.type = "text";

                togglePassword.textContent = "◉";

            } else {

                passwordInput.type = "password";

                togglePassword.textContent = "◉";

            }

        });



        const loginForm = document.getElementById("loginForm");

        loginForm.addEventListener("submit", function (event) {

            event.preventDefault();

            const email = document.getElementById("email").value;
            const password = document.getElementById("password").value;

            console.log("Email:", email);
            console.log("Password:", password);

            alert("Sign in submitted!");

        });

    </script>

</body>
