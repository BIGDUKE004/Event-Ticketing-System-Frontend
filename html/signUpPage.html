<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EventPadi</title>
    <link rel="stylesheet" href="../css/signUpPage.css">
</head>
<body>
    
    <div class="sign-up-container">

        <div class="logo-container">
            <img class="logo" src="../images/eventpad_logo_horizontal_purple.png">
        </div>

        <div class="create-account-text">
            <p class="big-text">
                Create Your Account
            </p>
            <p class="small-text">
                Join Events and start exploring amazing events
            </p>
        </div>

        <div class="inputs">
            <p class="input-name">
                Full name
            </p>
            <input type="text" placeholder="Enter your full name">

            <p class="input-name">
                Email address
            </p>
            <input type="text" placeholder="&#9993; Enter your email" >
            
            <p class="input-name">
                Password
            </p>
            <input type="text" placeholder="Create a password">

            <p class="input-name">
                Confirm Password
            </p>
            <input type="text" placeholder="Confirm your password">

            <div class="terms-and-condition-checkbox">
                <input type="checkbox">
                <p class="terms-text">I agree to the <span>Terms of Service</span> and <span>Privacy Policy</span></p>
            </div>

            <div class="sign-up-button">
                <button>
                    Sign Up
                </button>
            </div>

        </div>

        <div class="sign-in-link">
            <p class="sign-in-text">Already have an account?<span>Sign in</span></p>
        </div>
        
    </div>

</body>
</html>
